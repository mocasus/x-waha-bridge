<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">X WAHA Bridge social preview</title>
  <desc id="desc">Social preview card for X WAHA Bridge, a production-ready X to WhatsApp and Telegram bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03060D"/>
      <stop offset="0.47" stop-color="#08111F"/>
      <stop offset="1" stop-color="#18060C"/>
    </linearGradient>
    <linearGradient id="rail" x1="86" y1="88" x2="1194" y2="552" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D9BF0"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#EF233C"/>
    </linearGradient>
    <linearGradient id="flow" x1="572" y1="377" x2="1052" y2="377" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D9BF0"/>
      <stop offset="0.5" stop-color="#E8F4FF"/>
      <stop offset="1" stop-color="#EF233C"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(206 166) rotate(51.5) scale(323 492)">
      <stop stop-color="#1D9BF0" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#1D9BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 512) rotate(-142) scale(396 478)">
      <stop stop-color="#EF233C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#EF233C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80" y="-80" width="1440" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.11 0 0 0 0 0.61 0 0 0 0 0.94 0 0 0 0.30 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#blueGlow)"/>
  <rect width="1280" height="640" fill="url(#redGlow)"/>

  <path d="M86 89H1194V551H86V89Z" stroke="url(#rail)" stroke-width="3"/>
  <path d="M114 119H1166V521H114V119Z" stroke="#17243A" stroke-width="1.5"/>

  <g opacity="0.22">
    <path d="M154 473H1116" stroke="#1D9BF0" stroke-width="1"/>
    <path d="M154 433H1116" stroke="#1D9BF0" stroke-width="1"/>
    <path d="M154 393H1116" stroke="#1D9BF0" stroke-width="1"/>
    <path d="M154 353H1116" stroke="#1D9BF0" stroke-width="1"/>
    <path d="M154 313H1116" stroke="#1D9BF0" stroke-width="1"/>
  </g>

  <g transform="translate(150 164)">
    <circle cx="152" cy="152" r="136" fill="#060B14" stroke="#1D9BF0" stroke-width="5"/>
    <circle cx="152" cy="152" r="112" stroke="#17243A" stroke-width="2"/>
    <path d="M84 84L220 220" stroke="#F8FAFC" stroke-width="32" stroke-linecap="round"/>
    <path d="M220 84L84 220" stroke="#F8FAFC" stroke-width="32" stroke-linecap="round"/>
    <path d="M68 246C115 200 154 184 214 184H254" stroke="#EF233C" stroke-width="15" stroke-linecap="round"/>
  </g>

  <text x="500" y="204" fill="#F8FAFC" font-family="Bahnschrift, Cascadia Code, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1">X WAHA Bridge</text>
  <text x="504" y="258" fill="#BFD7F4" font-family="Cascadia Code, Consolas, Arial, sans-serif" font-size="24" font-weight="600">Public X posts -> WhatsApp + Telegram</text>
  <text x="504" y="308" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Production-ready relay with PostgreSQL state,</text>
  <text x="504" y="340" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Redis queues, retries, admin dashboard, Railway deploy,</text>
  <text x="504" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">and dark CLI control.</text>

  <g filter="url(#softGlow)">
    <path d="M574 416C639 362 705 362 770 416C835 470 901 470 966 416" stroke="url(#flow)" stroke-width="10" stroke-linecap="round"/>
    <path d="M941 384L975 416L941 448" stroke="#EF233C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Cascadia Code, Consolas, Arial, sans-serif" font-weight="700" font-size="18">
    <rect x="516" y="390" width="116" height="48" rx="24" fill="#081728" stroke="#1D9BF0"/>
    <text x="574" y="421" text-anchor="middle" fill="#DBEAFE">X RSS/API</text>

    <rect x="676" y="462" width="142" height="48" rx="24" fill="#0A1020" stroke="#506172"/>
    <text x="747" y="493" text-anchor="middle" fill="#E2E8F0">QUEUE</text>

    <rect x="940" y="390" width="128" height="48" rx="24" fill="#260A12" stroke="#EF233C"/>
    <text x="1004" y="421" text-anchor="middle" fill="#FFE4E8">WA + TG</text>
  </g>

  <g transform="translate(516 505)">
    <rect width="140" height="38" rx="19" fill="#0B1628" stroke="#1D9BF0"/>
    <text x="70" y="25" text-anchor="middle" fill="#DBEAFE" font-family="Cascadia Code, Consolas, Arial, sans-serif" font-size="15" font-weight="800">TypeScript</text>
  </g>
  <g transform="translate(672 505)">
    <rect width="132" height="38" rx="19" fill="#101827" stroke="#334155"/>
    <text x="66" y="25" text-anchor="middle" fill="#E2E8F0" font-family="Cascadia Code, Consolas, Arial, sans-serif" font-size="15" font-weight="800">BullMQ</text>
  </g>
  <g transform="translate(820 505)">
    <rect width="132" height="38" rx="19" fill="#101827" stroke="#334155"/>
    <text x="66" y="25" text-anchor="middle" fill="#E2E8F0" font-family="Cascadia Code, Consolas, Arial, sans-serif" font-size="15" font-weight="800">Railway</text>
  </g>
  <g transform="translate(968 505)">
    <rect width="136" height="38" rx="19" fill="#260A12" stroke="#EF233C"/>
    <text x="68" y="25" text-anchor="middle" fill="#FFE4E8" font-family="Cascadia Code, Consolas, Arial, sans-serif" font-size="15" font-weight="800">WAHA</text>
  </g>
</svg>
