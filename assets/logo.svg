<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">X WAHA Bridge</title>
  <desc id="desc">A clean banner logo for X WAHA Bridge, an automation service that mirrors X posts to WhatsApp and Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBF8"/>
      <stop offset="1" stop-color="#ECF4F0"/>
    </linearGradient>
    <linearGradient id="route" x1="244" y1="108" x2="911" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.45" stop-color="#00A36C"/>
      <stop offset="1" stop-color="#2487D1"/>
    </linearGradient>
    <linearGradient id="mark" x1="74" y1="68" x2="238" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1E3832"/>
    </linearGradient>
    <filter id="softShadow" x="45" y="48" width="220" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0D1714" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <path d="M64 288H1136" stroke="#D6E3DD" stroke-width="2"/>
  <path d="M64 72H1136" stroke="#E2ECE7" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="72" y="72" width="176" height="176" rx="44" fill="url(#mark)"/>
    <path d="M117 117L203 203" stroke="#F8FBF8" stroke-width="16" stroke-linecap="round"/>
    <path d="M203 117L117 203" stroke="#F8FBF8" stroke-width="16" stroke-linecap="round"/>
    <path d="M105 223C130 196 151 184 179 184H214" stroke="#00D084" stroke-width="10" stroke-linecap="round"/>
  </g>

  <path d="M282 180C374 116 462 116 548 180C633 243 725 242 817 180" stroke="url(#route)" stroke-width="12" stroke-linecap="round"/>
  <path d="M796 148L834 180L796 212" stroke="#2487D1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="294" y="120" width="112" height="52" rx="26" fill="#101820"/>
    <text x="350" y="153" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">X</text>
  </g>
  <g>
    <rect x="526" y="202" width="132" height="52" rx="26" fill="#E5F7EF" stroke="#B8E7D0" stroke-width="2"/>
    <text x="592" y="235" text-anchor="middle" fill="#0B6B48" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Queue</text>
  </g>
  <g>
    <rect x="808" y="120" width="156" height="52" rx="26" fill="#E8F3FF" stroke="#B8D9F5" stroke-width="2"/>
    <text x="886" y="153" text-anchor="middle" fill="#155F9D" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">WA + TG</text>
  </g>

  <text x="296" y="104" fill="#101820" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">X WAHA Bridge</text>
  <text x="296" y="274" fill="#41524B" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Mirror public X posts to WhatsApp and Telegram with PostgreSQL, Redis queues, retries, and an admin dashboard.</text>

  <g transform="translate(972 74)">
    <rect x="0" y="0" width="122" height="38" rx="19" fill="#101820"/>
    <text x="61" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Railway ready</text>
  </g>
</svg>
